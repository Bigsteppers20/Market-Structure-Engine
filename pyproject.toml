[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-structure-engine"
version = "1.0.0"
description = "Transforms raw OHLCV forex data into numerical market-structure features for ML models. Features only - never trade signals."
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools]
packages = ["market_structure", "ml_pipeline", "training", "logistic_regression"]
